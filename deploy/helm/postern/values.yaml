replicaCount: 2

image:
  repository: ghcr.io/rgreposito/postern
  tag: "0.1.0"
  pullPolicy: IfNotPresent

listen: "0.0.0.0:8443"
failClosed: true

# ticketKey: set via --set-file or an existing secret.
existingTicketSecret: postern-ticket

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
